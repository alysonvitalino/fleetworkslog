name: mobile

on:
  pull_request:
    paths: &paths
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (compila o shared no postinstall)
        run: npm ci

      - name: Lint
        run: npx eslint mobile shared

      - name: Typecheck
        run: npm run typecheck --workspace=mobile

      - name: Testes
        run: npm test --workspace=mobile

      - name: Expo Doctor (compatibilidade de dependências com o SDK)
        working-directory: mobile
        run: npx --yes expo-doctor

      - name: Bundle com Metro (Android e iOS)
        working-directory: mobile
        run: npx expo export --platform android --platform ios --output-dir ../mobile-bundle-check
