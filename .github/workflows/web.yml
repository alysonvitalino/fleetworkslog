name: web

on:
  pull_request:
    paths: &paths
      - 'web/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (compila o shared no postinstall)
        run: npm ci

      - name: Lint
        run: npx eslint web shared

      - name: Typecheck
        run: npm run typecheck --workspace=web

      - name: Testes
        run: npm test --workspace=web

      - name: Build
        run: npm run build --workspace=web
